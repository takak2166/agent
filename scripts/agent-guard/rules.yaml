# Agent Guard policy rules.
# Evaluation: first matching rule wins. If nothing matches, deny (fail-closed).
# Vocabulary lists are the single source of truth for normalize + engine.

version: 1
default: deny

vocab:
  sql_mutate:
    - insert
    - update
    - delete
    - drop
    - truncate
    - alter
    - create
    - grant
    - revoke
    - replace
    - merge
    - copy
    - call
  sql_read:
    - select
    - show
    - describe
    - explain
    - with
  http_mutate:
    - POST
    - PUT
    - PATCH
    - DELETE
  http_read:
    - GET
    - HEAD
    - OPTIONS
  kubectl_mutate:
    - apply
    - create
    - delete
    - edit
    - patch
    - replace
    - scale
    - rollout
    - exec
    - attach
    - cp
    - drain
    - cordon
    - uncordon
    - taint
    - label
    - annotate
    - set
  kubectl_read:
    - get
    - describe
    - logs
    - top
    - api-resources
    - api-versions
    - explain
    - cluster-info
    - config
    - version
    - auth
    - wait
  kubectl_value_flags:
    - "-n"
    - --namespace
    - --context
    - "-c"
    - --cluster
    - --user
    - --kubeconfig
  sql_clients:
    - psql
    - mysql
    - mariadb
    - sqlite3
    - sqlcmd
    - clickhouse-client
  http_clients:
    - curl
    - wget
    - http
    - https
  gh_read:
    - status
    - view
    - list
    - search
    - repo
    - issue
    - pr
    - run
    - workflow
    - release
    - help
    - version
  gh_write:
    - create
    - delete
    - edit
    - close
    - reopen
    - merge
    - upload
    - sync
    - fork

rules:
  # --- denies first (so allows cannot shadow them) ---
  - id: deny-sudo
    action: deny
    reason: "Commands that require sudo are blocked"
    match:
      kind: shell
      command_regex: '(^|[;&|]\s*)(sudo|doas|pkexec)\b'

  - id: deny-git-destructive
    action: deny
    reason: "Destructive git operations are blocked"
    match:
      kind: shell
      command_regex: '(^|[;&|]\s*)git\s+.*\b(reset\s+--hard|push\s+(\+|.*\s+\+|.*(--force|-f|--force-with-lease|--delete|--mirror)\b)|clean\s+-f|checkout\s+--orphan)\b'

  - id: deny-git-commit-bypass
    action: deny
    reason: "git commit --no-verify / --no-gpg-sign are blocked"
    match:
      kind: shell
      git_commit_bypass: true

  - id: deny-sql-mutate
    action: deny
    reason: "Mutating / DDL SQL is blocked"
    match:
      kind: sql
      operation_in: $vocab.sql_mutate

  - id: deny-sql-shell
    action: deny
    reason: "Mutating / DDL SQL via shell is blocked"
    match:
      kind: shell
      command_regex: $pattern.sql_mutate_shell

  - id: deny-kubectl-mutate
    action: deny
    reason: "Mutating kubectl commands are blocked"
    match:
      kind: shell
      kubectl_mutate: true

  - id: deny-http-mutate
    action: deny
    reason: "Mutating HTTP requests (POST/PUT/PATCH/DELETE) are blocked"
    match:
      kind: http
      method_in: $vocab.http_mutate

  - id: deny-http-shell
    action: deny
    reason: "Mutating HTTP requests via shell are blocked"
    match:
      kind: shell
      command_regex: $pattern.http_mutate_shell

  # --- allows ---
  - id: allow-file
    action: allow
    reason: "File tool operations are allowed"
    match:
      kind: file

  - id: allow-mcp
    action: allow
    reason: "MCP writes are allowed"
    match:
      kind: mcp

  - id: allow-git-commit-push
    action: allow
    reason: "git commit / push are allowed"
    match:
      kind: shell
      command_regex: '(^|[;&|]\s*)git\s+(commit|push)\b'

  - id: allow-sql-read
    action: allow
    reason: "Read-only SQL is allowed"
    match:
      kind: sql
      operation_in: $vocab.sql_read

  - id: allow-http-read
    action: allow
    reason: "Read-only HTTP is allowed"
    match:
      kind: http
      method_in: $vocab.http_read

  - id: allow-read-only-shell
    action: allow
    reason: "Read-only commands are allowed"
    match:
      kind: shell
      read_only: true
