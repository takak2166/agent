name: agent-guard

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/agent-guard.yml
      - scripts/agent-guard/**
  pull_request:
    paths:
      - .github/workflows/agent-guard.yml
      - scripts/agent-guard/**

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -r scripts/agent-guard/requirements-dev.txt

      - name: Run tests
        run: python -m unittest discover -s scripts/agent-guard/tests -v
